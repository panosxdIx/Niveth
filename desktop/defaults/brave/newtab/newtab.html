<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niveth</title>

<style>
:root {
  --accent: #a96cff;
  --accent-soft: #d8c5ff;
  --glass: rgba(255,255,255,.58);
  --glass-strong: rgba(255,255,255,.76);
  --text: #2d1f43;
  --muted: #654f7d;
  --border: rgba(169,108,255,.55);
  --shadow: rgba(117,72,190,.28);
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent: #a56cff;
    --accent-soft: #46306f;
    --glass: rgba(14,11,31,.58);
    --glass-strong: rgba(23,17,45,.78);
    --text: #f7efff;
    --muted: #c4acd9;
    --border: rgba(165,108,255,.62);
    --shadow: rgba(130,70,220,.38);
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  overflow: hidden;
  background: #110b20;
}

.page {
  position: relative;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(
      180deg,
      rgba(31,12,54,.12) 0%,
      rgba(20,8,38,.05) 42%,
      rgba(8,4,20,.45) 100%
    ),
    url("assets/light-wallpaper.png");
  background-size: cover;
  background-position: center;
}

@media (prefers-color-scheme: dark) {
  .page {
    background-image:
      linear-gradient(
        180deg,
        rgba(10,4,28,.22) 0%,
        rgba(10,3,25,.16) 42%,
        rgba(4,2,12,.66) 100%
      ),
      url("assets/dark-wallpaper.png");
  }
}

.page::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 30%, rgba(169,108,255,.22), transparent 34%),
    radial-gradient(circle at 15% 80%, rgba(202,125,255,.13), transparent 28%),
    radial-gradient(circle at 85% 20%, rgba(122,94,255,.12), transparent 25%);
  pointer-events: none;
}

.top {
  position: absolute;
  top: 30px;
  left: 42px;
  right: 42px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}

.brand {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.8px;
  text-shadow: 0 0 22px rgba(169,108,255,.42);
}

.brand span {
  color: var(--accent);
}

.clock {
  text-align: right;
}

.time {
  font-size: 46px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -2px;
}

.date {
  margin-top: 8px;
  font-size: 14px;
  color: var(--muted);
}

.center {
  position: absolute;
  top: 27%;
  left: 50%;
  transform: translateX(-50%);
  width: min(680px, calc(100% - 50px));
  z-index: 2;
}

.search {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow:
    0 12px 45px var(--shadow),
    0 0 30px rgba(169,108,255,.15);
}

.search-icon {
  width: 20px;
  height: 20px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  position: relative;
  flex: 0 0 auto;
}

.search-icon::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 2px;
  background: var(--accent);
  right: -6px;
  bottom: -3px;
  transform: rotate(45deg);
  border-radius: 2px;
}

.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 17px;
}

.search input::placeholder {
  color: var(--muted);
}

.shortcuts {
  margin-top: 32px;
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.shortcut {
  width: 88px;
  height: 88px;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  color: var(--text);
  background: var(--glass);
  border: 1px solid rgba(255,255,255,.35);
  backdrop-filter: blur(18px);
  box-shadow:
    0 8px 28px rgba(0,0,0,.12),
    0 0 20px rgba(169,108,255,.08);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.shortcut:hover {
  transform: translateY(-4px);
  border-color: var(--border);
  box-shadow:
    0 12px 35px var(--shadow),
    0 0 28px rgba(169,108,255,.22);
}

.icon {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  background: linear-gradient(135deg, var(--accent-soft), var(--accent));
  color: white;
  box-shadow: 0 0 18px rgba(169,108,255,.24);
}

.label {
  margin-top: 7px;
  font-size: 12px;
  color: var(--muted);
}

.bottom {
  position: absolute;
  bottom: 28px;
  left: 42px;
  right: 42px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  z-index: 2;
}

.tag {
  padding: 8px 14px;
  border-radius: 14px;
  background: var(--glass);
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(15px);
  font-size: 12px;
  color: var(--muted);
}

.glow-line {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(169,108,255,.15),
    rgba(169,108,255,.72),
    rgba(169,108,255,.15),
    transparent
  );
  box-shadow: 0 0 18px rgba(169,108,255,.55);
}
</style>
</head>

<body>
<div class="page">

  <div class="top">
    <div class="brand">Ni<span>veth</span></div>

    <div class="clock">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date"></div>
    </div>
  </div>

  <main class="center">

    <form class="search" id="searchForm">
      <div class="search-icon"></div>
      <input
        id="searchInput"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search the web privately..."
        autofocus
      >
    </form>

    <div class="shortcuts">

      <a class="shortcut" href="https://www.youtube.com/">
        <div class="icon">YT</div>
        <div class="label">YouTube</div>
      </a>

      <a class="shortcut" href="https://github.com/">
        <div class="icon">GH</div>
        <div class="label">GitHub</div>
      </a>

      <a class="shortcut" href="https://chatgpt.com/">
        <div class="icon">AI</div>
        <div class="label">ChatGPT</div>
      </a>

      <a class="shortcut" href="https://mail.google.com/">
        <div class="icon">GM</div>
        <div class="label">Gmail</div>
      </a>

      <a class="shortcut" href="https://drive.google.com/">
        <div class="icon">GD</div>
        <div class="label">Drive</div>
      </a>

    </div>

  </main>

  <div class="bottom">
    <div class="tag">Niveth · Vaporwave</div>
    <div class="tag" id="mode">System theme</div>
  </div>

  <div class="glow-line"></div>

</div>

  <script src="script.js"></script>


</body>
</html>
