# ============================================================
# NIVETH TERMINAL — KITTY
# ============================================================

# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

font_family Noto Mono
font_size 11.0

bold_font auto
italic_font auto
bold_italic_font auto

# ------------------------------------------------------------
# Window / Glass
# ------------------------------------------------------------

background_opacity 0.50
dynamic_background_opacity yes

background_blur 20

window_padding_width 14
window_margin_width 0

hide_window_decorations no

placement_strategy center

# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

cursor_shape beam
cursor_blink_interval 0

# ------------------------------------------------------------
# Scrollback
# ------------------------------------------------------------

scrollback_lines 10000
scrollback_pager_history_size 10000

# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

tab_title_template "{title}"

# ------------------------------------------------------------
# Behavior
# ------------------------------------------------------------

enable_audio_bell no
visual_bell_duration 0.0

strip_trailing_spaces smart

confirm_os_window_close 0

allow_remote_control no

# ------------------------------------------------------------
# Niveth Dark palette
# ------------------------------------------------------------

foreground #E7EDF4
background #182433

color0  #182433
color1  #D8797F
color2  #7FA58C
color3  #C5A66A
color4  #7F9DB8
color5  #A68EAA
color6  #76AAB2
color7  #DCE4EC

color8  #627181
color9  #E89AA0
color10 #9CBCA7
color11 #D9BF87
color12 #9AB5CD
color13 #C0A9C0
color14 #95C7CD
color15 #F7F9FC

cursor #E7EDF4
cursor_text_color #182433

selection_foreground #E7EDF4
selection_background #4E6378

# ------------------------------------------------------------
# OS integration
# ------------------------------------------------------------

linux_display_server wayland

# ============================================================
# NIVETH COPY / PASTE
# ============================================================

# Left mouse selection -> system clipboard
copy_on_select clipboard

# Right click should not extend the selection.

# Right click release -> paste from system clipboard.

# ============================================================
# NIVETH RIGHT-CLICK CONTEXT MENU
# ============================================================

copy_on_select clipboard


# ============================================================
# END NIVETH RIGHT-CLICK CONTEXT MENU
# ============================================================

# ============================================================
# NIVETH KITTY CONTEXT MENU
# ============================================================

# Right-click Niveth menu

# Reliable keyboard shortcuts

# BEGIN NIVETH KITTY REMOTE CONTROL
allow_remote_control yes
listen_on unix:/tmp/niveth-kitty

# Niveth right-click menu
mouse_map right press ungrabbed launch --type=background --allow-remote-control python3 "$HOME/.config/kitty/niveth-context-menu.py"
mouse_map right press grabbed launch --type=background --allow-remote-control python3 "$HOME/.config/kitty/niveth-context-menu.py"

# Normal Kitty shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_os_window

# END NIVETH KITTY REMOTE CONTROL
