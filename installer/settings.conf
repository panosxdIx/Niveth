---
modules-search: [ local ]

instances:

- id: before_bootloader
  module: contextualprocess
  config: before_bootloader_context.conf

- id: before_bootloader_kerncopy
  module: shellprocess
  config: shellprocess_before_bootloader_kerncopy.conf

- id: logs
  module: shellprocess
  config: shellprocess_logs.conf

- id: bug-LP#1829805
  module: shellprocess
  config: shellprocess_bug-LP#1829805.conf

- id: add386arch
  module: shellprocess
  config: shellprocess_add386arch.conf

- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf

- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf

- id: fix-oem-uid
  module: shellprocess
  config: shellprocess_fix_oem_uid.conf

sequence:

- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary

- exec:
    - partition
    - mount
    - unpackfs
    - machineid

    - locale
    - keyboard
    - localecfg

    - luksbootkeyfile
    - fstab

    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd

    - shellprocess@bug-LP#1829805
    - shellprocess@fixconkeys_part1
    - shellprocess@fixconkeys_part2

    - initramfscfg
    - initramfs

    - shellprocess@before_bootloader_kerncopy
    - grubcfg
    - contextualprocess@before_bootloader
    - bootloader

    - shellprocess@add386arch

    - shellprocess@logs
    - umount

- show:
    - finished

branding: niveth

prompt-install: true
dont-chroot: false
oem-setup: false

disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false

quit-at-end: false
