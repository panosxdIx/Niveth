name: Niveth Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -e
          while IFS= read -r -d "" f; do
            bash -n "$f"
          done < <(find scripts -type f -name "*.sh" -print0)

      - name: Validate required project files
        shell: bash
        run: |
          set -e
          test -f project.conf
          test -f README.md
          test -f CONTRIBUTING.md
          test -f scripts/build-snapshot-iso.sh
          test -d desktop
          test -d installer
          test -d packages
          test -d docs/screenshots
